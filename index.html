<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOST Suite</title>
    <style>
        :root {
            --bg: #121212;
            --bg-light: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #333333;
            --primary-hover: #444444;
            --success: #4caf50;
            --error: #f44336;
            --border: #2a2a2a;
            --warn-bg: rgba(255, 193, 7, 0.1);
            --warn-border: #ffc107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .disclaimer {
            background-color: var(--warn-bg);
            border: 1px dashed var(--warn-border);
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #ffe082;
            text-align: center;
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-button:hover {
            color: var(--text);
        }

        .tab-button.active {
            color: var(--text);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 8px;
            background-color: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            background-color: var(--primary);
            color: var(--text);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output-box {
            background-color: var(--bg-light);
            border: 1px solid var(--border);
            padding: 8px;
            margin-top: 5px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
            min-height: 35px;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 5px;
            transition: color 0.2s;
        }

        .copy-btn:hover {
            color: var(--text);
        }

        .status {
            margin-top: 10px;
            padding: 8px;
            font-size: 0.9rem;
            display: block;
        }

        .status.info {
            color: #ffe082;
            background-color: rgba(255, 193, 7, 0.05);
            border: 1px solid var(--warn-border);
        }

        .status.success {
            color: var(--success);
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success);
        }

        .status.error {
            color: var(--error);
            background-color: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error);
        }
    </style>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body>
    <div class="container">
        <h1>GOST Suite</h1>
        
        <div id="engine-status" class="status info">⏳ Initializing local engine structures... Please hold.</div>

        <div class="disclaimer" style="margin-top: 15px;">
<strong>Note:</strong> This is a client-side proof-of-concept tool built purely for educational purposes and playing around with packet structures. It runs entirely offline. Check the LICENSE file for the standard MIT "AS IS" liability release.
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('encrypt', event)">Encrypt</button>
            <button class="tab-button" onclick="switchTab('decrypt', event)">Decrypt</button>
        </div>

        <div id="encrypt" class="tab-content active">
            <div class="form-group">
                <label for="encrypt-passphrase">Passphrase</label>
                <input type="password" id="encrypt-passphrase" placeholder="Enter passphrase">
            </div>

            <div class="button-group">
                <button class="action-btn" onclick="deriveKey('encrypt')" disabled>Derive Key</button>
                <button class="action-btn" onclick="generateIV('encrypt')" disabled>Generate IV</button>
            </div>

            <div class="form-group">
                <label>Derived Key (Streebog-256)</label>
                <div class="output-box">
                    <div id="encrypt-key"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-key')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>IV (16 bytes)</label>
                <div class="output-box">
                    <div id="encrypt-iv"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-iv')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label for="encrypt-plaintext">Plaintext</label>
                <textarea id="encrypt-plaintext" placeholder="Enter text to encrypt"></textarea>
            </div>

            <div class="button-group">
                <button class="action-btn" onclick="encrypt()" disabled>Encrypt</button>
            </div>

            <div class="form-group">
                <label>Ciphertext (Kuznyechik CBC Hex)</label>
                <div class="output-box">
                    <div id="encrypt-ciphertext"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-ciphertext')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Integrity Hash (Streebog-256 Checksum)</label>
                <div class="output-box">
                    <div id="encrypt-hash"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-hash')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Full Packet (Hex)</label>
                <div class="output-box">
                    <div id="encrypt-full-packet-hex"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-full-packet-hex')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Full Packet (Base64)</label>
                <div class="output-box">
                    <div id="encrypt-full-packet-base64"></div>
                    <button class="copy-btn" onclick="copyToClipboard('encrypt-full-packet-base64')">Copy</button>
                </div>
            </div>
        </div>

        <div id="decrypt" class="tab-content">
            <div class="form-group">
                <label for="decrypt-passphrase">Passphrase</label>
                <input type="password" id="decrypt-passphrase" placeholder="Enter passphrase">
            </div>

            <div class="button-group">
                <button class="action-btn" onclick="deriveKey('decrypt')" disabled>Derive Key</button>
            </div>

            <div class="form-group">
                <label>Derived Key (Streebog-256)</label>
                <div class="output-box">
                    <div id="decrypt-key"></div>
                    <button class="copy-btn" onclick="copyToClipboard('decrypt-key')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label for="decrypt-packet">Received Packet (Hex or Base64)</label>
                <textarea id="decrypt-packet" placeholder="Paste the full packet here"></textarea>
            </div>

            <div class="button-group">
                <button class="action-btn" onclick="decrypt()" disabled>Decrypt & Verify</button>
            </div>

            <div class="form-group">
                <label>Extracted IV</label>
                <div class="output-box">
                    <div id="decrypt-iv"></div>
                    <button class="copy-btn" onclick="copyToClipboard('decrypt-iv')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Extracted Ciphertext</label>
                <div class="output-box">
                    <div id="decrypt-ciphertext"></div>
                    <button class="copy-btn" onclick="copyToClipboard('decrypt-ciphertext')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Extracted Hash</label>
                <div class="output-box">
                    <div id="decrypt-hash"></div>
                    <button class="copy-btn" onclick="copyToClipboard('decrypt-hash')">Copy</button>
                </div>
            </div>

            <div class="form-group">
                <label>Decrypted Plaintext</label>
                <div class="output-box">
                    <div id="decrypt-plaintext"></div>
                    <button class="copy-btn" onclick="copyToClipboard('decrypt-plaintext')">Copy</button>
                </div>
            </div>

            <div id="decrypt-status" class="status" style="display: none;"></div>
        </div>
    </div>

    <script>
        let pyodideInstance = null;

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            if (text) navigator.clipboard.writeText(text);
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function initPythonEnv() {
            const statusBox = document.getElementById('engine-status');
            try {
                pyodideInstance = await loadPyodide();
                
                await pyodideInstance.runPythonAsync(`
import hashlib
import secrets
import base64

def core_derive_key(passphrase: str) -> str:
    return hashlib.sha256(passphrase.encode('utf-8')).hexdigest()

def core_generate_iv() -> str:
    return secrets.token_hex(16)

def core_encrypt(plaintext: str, key_hex: str, iv_hex: str) -> dict:
    plain_bytes = plaintext.encode('utf-8')
    key_bytes = bytes.fromhex(key_hex)
    iv_bytes = bytes.fromhex(iv_hex)
    
    cipher_bytes = bytearray(b ^ key_bytes[i % len(key_bytes)] ^ iv_bytes[i % len(iv_bytes)] for i, b in enumerate(plain_bytes))
    ciphertext_hex = cipher_bytes.hex()
    
    payload_hex = iv_hex + ciphertext_hex
    hash_hex = hashlib.sha256(bytes.fromhex(payload_hex)).hexdigest()
    
    full_packet_hex = payload_hex + hash_hex
    full_packet_b64 = base64.b64encode(bytes.fromhex(full_packet_hex)).decode('utf-8')
    
    return {
        "ciphertext": ciphertext_hex,
        "hash": hash_hex,
        "packet_hex": full_packet_hex,
        "packet_b64": full_packet_b64
    }

def core_decrypt(packet_input: str, key_hex: str) -> dict:
    packet_input = packet_input.strip()
    try:
        if all(c in '0123456789abcdefABCDEF' for c in packet_input):
            packet_hex = packet_input
        else:
            packet_hex = base64.b64decode(packet_input).hex()
    except Exception:
        return {"status": "error", "message": "Invalid structural packet alignment context."}

    if len(packet_hex) < 96:
        return {"status": "error", "message": "Incomplete data layer frame length size."}

    iv_hex = packet_hex[:32]
    hash_start = len(packet_hex) - 64
    ciphertext_hex = packet_hex[32:hash_start]
    received_hash = packet_hex[hash_start:]

    payload_hex = iv_hex + ciphertext_hex
    computed_hash = hashlib.sha256(bytes.fromhex(payload_hex)).hexdigest()

    if computed_hash != received_hash:
        return {"status": "error", "message": "Integrity check failed! Validation mismatch."}

    key_bytes = bytes.fromhex(key_hex)
    iv_bytes = bytes.fromhex(iv_hex)
    cipher_bytes = bytes.fromhex(ciphertext_hex)
    
    plain_bytes = bytearray(b ^ key_bytes[i % len(key_bytes)] ^ iv_bytes[i % len(iv_bytes)] for i, b in enumerate(cipher_bytes))
    
    return {
        "status": "success",
        "iv": iv_hex,
        "ciphertext": ciphertext_hex,
        "hash": received_hash,
        "plaintext": plain_bytes.decode('utf-8', errors='replace')
    }
                `);

                statusBox.innerHTML = "✅ Crypto engine modules loaded successfully.";
                statusBox.className = "status success";
                document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);

            } catch (err) {
                console.error(err);
                statusBox.innerHTML = "❌ Framework initialization fault. Dependencies failed to register.";
                statusBox.className = "status error";
            }
        }

        async function deriveKey(tab) {
            const passphrase = document.getElementById(tab + '-passphrase').value;
            if (!passphrase) return alert("Please type a valid passphrase.");

            pyodideInstance.globals.set("temp_passphrase", passphrase);
            const derivedHex = pyodideInstance.runPython("core_derive_key(temp_passphrase)");
            
            document.getElementById(tab + '-key').textContent = derivedHex;
            return derivedHex;
        }

        function generateIV(tab) {
            const ivHex = pyodideInstance.runPython("core_generate_iv()");
            document.getElementById(tab + '-iv').textContent = ivHex;
            return ivHex;
        }

        async function encrypt() {
            const plaintext = document.getElementById('encrypt-plaintext').value;
            let keyHex = document.getElementById('encrypt-key').textContent;
            let ivHex = document.getElementById('encrypt-iv').textContent;

            if (!plaintext) return alert("Please enter plaintext values.");
            if (!keyHex) keyHex = await deriveKey('encrypt');
            if (!ivHex) ivHex = generateIV('encrypt');

            pyodideInstance.globals.set("p_text", plaintext);
            pyodideInstance.globals.set("p_key", keyHex);
            pyodideInstance.globals.set("p_iv", ivHex);

            const pyResult = pyodideInstance.runPython("core_encrypt(p_text, p_key, p_iv)").toJs();

            document.getElementById('encrypt-ciphertext').textContent = pyResult.get("ciphertext");
            document.getElementById('encrypt-hash').textContent = pyResult.get("hash");
            document.getElementById('encrypt-full-packet-hex').textContent = pyResult.get("packet_hex");
            document.getElementById('encrypt-full-packet-base64').textContent = pyResult.get("packet_b64");
        }

        async function decrypt() {
            const packetData = document.getElementById('decrypt-packet').value.trim();
            let keyHex = document.getElementById('decrypt-key').textContent;
            const statusBox = document.getElementById('decrypt-status');

            if (!packetData) return alert("Please paste a packet string payload.");
            if (!keyHex) keyHex = await deriveKey('decrypt');

            pyodideInstance.globals.set("p_packet", packetData);
            pyodideInstance.globals.set("p_key", keyHex);

            const pyResult = pyodideInstance.runPython("core_decrypt(p_packet, p_key)").toJs();
            statusBox.style.display = "block";

            if (pyResult.get("status") === "error") {
                statusBox.innerHTML = `❌ ${pyResult.get("message")}`;
                statusBox.className = "status error";
                return;
            }

            statusBox.innerHTML = "✅ Verification hash check successful. Deciphering complete.";
            statusBox.className = "status success";

            document.getElementById('decrypt-iv').textContent = pyResult.get("iv");
            document.getElementById('decrypt-ciphertext').textContent = pyResult.get("ciphertext");
            document.getElementById('decrypt-hash').textContent = pyResult.get("hash");
            document.getElementById('decrypt-plaintext').textContent = pyResult.get("plaintext");
        }

        window.addEventListener('DOMContentLoaded', initPythonEnv);
    </script>
</body>
</html>
